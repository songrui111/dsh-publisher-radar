name: release

# Four channels carry the same commit and they are not interchangeable:
#   GitHub Release asset → what the plugin market installs from
#   npm                  → the package itself
#   catalog entry        → a PR to awesome-dsh-plugin/awesome-dsh-plugin (manual)
#   a working profile    → scripts/sync.mjs, then a DSH restart
#
# The asset is published FIRST because it is the market's critical path; a failing
# npm publish then fails the run loudly without withholding the release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The token must be visible to a step-level `if:` — `secrets.*` is not available
    # there, which is why the condition reads job-level `env` instead.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Smoke test
        run: node test/smoke.mjs && node test/host.mjs

      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          name=$(npm pack --silent)
          echo "tarball=$name" >> "$GITHUB_OUTPUT"
          # The market's URL points at a fixed name; never rename this copy.
          cp "$name" dsh-publisher-radar.tgz
          tar -tzf dsh-publisher-radar.tgz | head -40

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-publisher-radar.tgz
          generate_release_notes: true

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

          # Who is this token? Printing the identity turns "E404 on PUT" from a mystery
          # into one of three known answers: wrong account, read-only token, or a
          # granular token scoped to other packages.
          echo "publishing as : $(npm whoami 2>&1 || echo '<token invalid>')"

          version=$(node -p "require('./package.json').version")
          if npm view "dsh-publisher-radar@${version}" version >/dev/null 2>&1; then
            echo "::notice::dsh-publisher-radar@${version} is already on npm — nothing to publish"
            exit 0
          fi

          # The registry answers 202 and replicates later, so "not visible yet" and "not
          # published" look the same for a while. A publish that comes back with
          # "cannot publish over the previously published versions" means the version is
          # already there — that is a success, not a failure.
          npm publish --access public 2>&1 | tee npm-publish.log || {
            if grep -q 'previously published versions' npm-publish.log; then
              echo "::notice::dsh-publisher-radar@${version} was already published (registry replicas lag) — treating as success"
              exit 0
            fi
            echo "::error::npm publish failed: $(tail -20 npm-publish.log | tr '\n' ' ')"
            exit 1
          }
